services:
  - type: web
    name: csp-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: COOKIE_SECURE
        value: "true"
      - key: OPEN_REGISTRATION
        value: "true"
      - key: PROFANITY_FILTER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: csp-chat-db
          property: connectionString

databases:
  - name: csp-chat-db
    plan: free
